<!doctype html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
  </head>
  <body class="text-center">
    <section>
      <div class="mt-[10%] flex justify-center items-center">
        <div>
          <span class="text-8xl bg-gray-500 rounded">
            <i class="fa-solid fa-list-check"></i>
          </span>

          <p class="my-10 text-gray-400 text-4xl">My To-Do List</p>
        </div>
      </div>

      <form class="flex justify-center gap-2 flex-col md:flex-row submit-user">
        <input
          class="md:w-[30%] w-[91%] p-2 ml-4 md:ml-0 border rounded input-user"
          type="text"
          placeholder="Add Task"
          required
        />
        <button class="text-gray-500 btn-logic">Add</button>
      </form>
    </section>

    <section class="mt-[4%] flex mx-4 gap-3 grid grid-cols-12 user-render">
      
    </section>


    <div class="my-6 flex justify-center" >
      <button class="border py-2 px-12 rounded bg-[red] text-gray-200 btn-deletAll ">
        Clear All
      </button>
    </div>

    <script src="./js/script.js"></script>
  </body>
</html>
